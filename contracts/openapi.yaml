openapi: 3.0.3
info:
  title: "EntradasYa orders: API y contratos HTTP consumidos"
  version: 1.0.0
  description: Las rutas públicas pasan por Nginx. Las rutas internas y los
    chequeos usan sus servidores locales.
servers:
  - url: http://localhost:8080
    description: Nginx local
security:
  - BearerAuth: []
paths:
  /api/events/images:
    post:
      tags:
        - events
      operationId: uploadEventImage
      summary: Subir una portada de evento
      description: Organizador. Recibe JPEG, PNG o WebP en base64 de hasta 5 MiB y
        devuelve su ruta pública local.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - content
              properties:
                content:
                  type: string
                  minLength: 4
                  maxLength: 6990508
      responses:
        "201":
          description: Portada guardada como WebP.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - imagePath
                properties:
                  imagePath:
                    type: string
                    pattern: ^/api/events/images/[0-9a-f-]{36}$
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "503":
          $ref: "#/components/responses/Error503"
  /api/events/images/{imageId}:
    get:
      tags:
        - events
      operationId: getEventImage
      summary: Leer una portada local
      security: []
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Imagen WebP.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "503":
          $ref: "#/components/responses/Error503"
  /api/events:
    get:
      tags:
        - events
      operationId: listPublishedEvents
      summary: Listar eventos publicados
      security: []
      responses:
        "200":
          description: Cartelera.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "503":
          $ref: "#/components/responses/Error503"
    post:
      tags:
        - events
      operationId: createEvent
      summary: Crear evento en borrador
      description: "Acceso: organizador."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Evento creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "503":
          $ref: "#/components/responses/Error503"
  /api/events/{eventId}:
    get:
      tags:
        - events
      operationId: getPublishedEvent
      summary: Consultar evento publicado
      security: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Detalle público.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "503":
          $ref: "#/components/responses/Error503"
    put:
      tags:
        - events
      operationId: updateEvent
      summary: Editar datos de un evento propio
      description: "Acceso: organizador."
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Evento actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "503":
          $ref: "#/components/responses/Error503"
  /api/events/mine:
    get:
      tags:
        - events
      operationId: listOwnEvents
      summary: Listar eventos propios
      description: "Acceso: organizador."
      responses:
        "200":
          description: Eventos propios en cualquier estado, con sus sectores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "503":
          $ref: "#/components/responses/Error503"
  /api/events/{eventId}/status:
    put:
      tags:
        - events
      operationId: updateEventStatus
      summary: Publicar o cancelar un evento propio
      description: "Acceso: organizador. Repetir el estado actual devuelve la
        representación vigente."
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventStatusInput"
      responses:
        "200":
          description: Estado del evento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "503":
          $ref: "#/components/responses/Error503"
  /api/events/{eventId}/sectors:
    post:
      tags:
        - events
      operationId: createSector
      summary: Crear un sector en un evento propio
      description: "Acceso: organizador."
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectorInput"
      responses:
        "201":
          description: Sector creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sector"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "503":
          $ref: "#/components/responses/Error503"
  /api/events/{eventId}/sectors/{sectorId}:
    put:
      tags:
        - events
      operationId: updateSector
      summary: Editar sector y cupo
      description: "Acceso: organizador."
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/SectorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectorInput"
      responses:
        "200":
          description: Sector actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sector"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "503":
          $ref: "#/components/responses/Error503"
  /api/orders:
    post:
      tags:
        - orders
      operationId: purchaseTickets
      summary: Crear o reanudar una compra
      description: "Acceso: cliente."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Purchase"
      responses:
        "200":
          description: Orden pagada con entradas listas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "202":
          description: Compra en curso y reanudable con la misma petición.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "503":
          $ref: "#/components/responses/Error503"
    get:
      tags:
        - orders
      operationId: listOwnOrders
      summary: Listar órdenes propias
      description: "Acceso: cliente."
      responses:
        "200":
          description: Historial del cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "503":
          $ref: "#/components/responses/Error503"
  /api/orders/{orderId}:
    get:
      tags:
        - orders
      operationId: getOwnOrder
      summary: Consultar una orden propia
      description: "Acceso: cliente."
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Estado persistido de la orden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "503":
          $ref: "#/components/responses/Error503"
  /api/orders/sales/{eventId}:
    get:
      tags:
        - orders
      operationId: getSales
      summary: Consultar ventas propias por evento
      description: "Acceso: organizador."
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Totales pagados del organizador para el evento indicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sales"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "503":
          $ref: "#/components/responses/Error503"
  /api/tickets:
    get:
      tags:
        - tickets
      operationId: listOwnTickets
      summary: Listar entradas emitidas propias
      description: "Acceso: cliente."
      parameters:
        - $ref: "#/components/parameters/OrderFilter"
      responses:
        "200":
          description: Entradas disponibles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketList"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "503":
          $ref: "#/components/responses/Error503"
  /api/tickets/{ticketId}/pdf:
    get:
      tags:
        - tickets
      operationId: downloadOwnTicket
      summary: Descargar PDF de una entrada propia
      description: "Acceso: cliente."
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: PDF de la entrada.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "503":
          $ref: "#/components/responses/Error503"
  /internal/events/reservations/{orderId}:
    put:
      tags:
        - events
      operationId: reserveCapacity
      summary: Reservar cupos por orden
      description: "Acceso: orders. Usa SOLD_OUT, EVENT_UNAVAILABLE o
        RESERVATION_CONFLICT para distinguir los conflictos."
      security:
        - InternalToken: []
      servers:
        - url: http://127.0.0.1:3002
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationInput"
      responses:
        "200":
          description: Reserva activa e instantánea de precio y evento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "503":
          $ref: "#/components/responses/Error503"
    delete:
      tags:
        - events
      operationId: releaseCapacity
      summary: Liberar reserva por orden
      description: "Acceso: orders."
      security:
        - InternalToken: []
      servers:
        - url: http://127.0.0.1:3002
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "204":
          description: Reserva liberada, liberada previamente o inexistente.
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "503":
          $ref: "#/components/responses/Error503"
  /internal/payments/{orderId}:
    put:
      tags:
        - payments
      operationId: processPayment
      summary: Simular pago por orden
      description: "Acceso: orders."
      security:
        - InternalToken: []
      servers:
        - url: http://127.0.0.1:3004
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: Resultado persistido del pago, aprobado o rechazado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "503":
          $ref: "#/components/responses/Error503"
  /internal/tickets/orders/{orderId}:
    put:
      tags:
        - tickets
      operationId: issueTickets
      summary: Emitir entradas para una orden pagada
      description: "Acceso: orders."
      security:
        - InternalToken: []
      servers:
        - url: http://127.0.0.1:3005
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueTickets"
      responses:
        "200":
          description: Lote completo de entradas emitidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketList"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "503":
          $ref: "#/components/responses/Error503"
  /internal/tickets/lookup:
    post:
      tags:
        - tickets
      operationId: lookupTicket
      summary: Consultar un código de entrada
      description: "Acceso: checkin."
      security:
        - InternalToken: []
      servers:
        - url: http://127.0.0.1:3005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketLookup"
      responses:
        "200":
          description: Identidad y evento de una entrada emitida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketMatch"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "503":
          $ref: "#/components/responses/Error503"
  /internal/notifications/orders/{orderId}:
    post:
      tags:
        - notifications
      operationId: sendConfirmation
      summary: Enviar correo de confirmación
      description: "Acceso: orders."
      security:
        - InternalToken: []
      servers:
        - url: http://127.0.0.1:3006
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationInput"
      responses:
        "204":
          description: Correo aceptado por Mailpit.
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "503":
          $ref: "#/components/responses/Error503"
  /health:
    get:
      tags:
        - operación
      operationId: getHealth
      summary: Consultar salud local
      security: []
      responses:
        "200":
          description: Disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Recurso local indisponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
      servers:
        - url: http://127.0.0.1:3001
          description: auth
        - url: http://127.0.0.1:3002
          description: events
        - url: http://127.0.0.1:3003
          description: orders
        - url: http://127.0.0.1:3004
          description: payments
        - url: http://127.0.0.1:3005
          description: tickets
        - url: http://127.0.0.1:3006
          description: notifications
        - url: http://127.0.0.1:3007
          description: checkin
        - url: http://localhost:8080
          description: web mediante Nginx
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      description: Identificador de evento.
      schema:
        type: string
        format: uuid
    SectorId:
      name: sectorId
      in: path
      required: true
      description: Identificador de sector.
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      description: Identificador de orden.
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      description: Identificador de entrada.
      schema:
        type: string
        format: uuid
    OrderFilter:
      name: orderId
      in: query
      required: false
      description: Filtra por orden del titular.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID de un intento de compra.
      schema:
        type: string
        format: uuid
  responses:
    Error400:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error401:
      description: Credenciales ausentes, inválidas o expiradas.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error403:
      description: Rol o credencial interna insuficiente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error404:
      description: Recurso inexistente o fuera del acceso de la cuenta.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error409:
      description: Conflicto de estado o de idempotencia.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error422:
      description: Pago rechazado y cupo liberado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error503:
      description: Indisponibilidad temporal.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        orderId:
          type: string
          format: uuid
    Registration:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    Login:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - cliente
            - organizador
            - portero
    Session:
      type: object
      additionalProperties: false
      required:
        - token
        - user
      properties:
        token:
          type: string
          minLength: 1
        user:
          $ref: "#/components/schemas/User"
    EventInput:
      type: object
      additionalProperties: false
      required:
        - name
        - date
        - venue
        - imageUrl
        - description
      properties:
        name:
          type: string
          minLength: 1
        date:
          type: string
          format: date-time
        venue:
          type: string
          minLength: 1
        imageUrl:
          type: string
          format: uri
        description:
          type: string
          minLength: 1
    SectorInput:
      type: object
      additionalProperties: false
      required:
        - name
        - unitPriceMinor
        - capacity
      properties:
        name:
          type: string
          minLength: 1
        unitPriceMinor:
          type: integer
          minimum: 1
        capacity:
          type: integer
          minimum: 1
    Sector:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - unitPriceMinor
        - capacity
        - available
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
